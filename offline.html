<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>悠哉博客 - 离线状态</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f4f4f4;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #333;
    }
    .offline-container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .offline-icon {
      font-size: 60px;
      color: #ff4444;
      margin-bottom: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .retry-btn {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .retry-btn:hover {
      background-color: #388E3C;
    }
    .cached-pages {
      margin-top: 30px;
      width: 100%;
    }
    .cached-pages h3 {
      color: #333;
      margin-bottom: 15px;
    }
    .cached-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .cached-list li {
      margin-bottom: 10px;
    }
    .cached-list a {
      color: #0088cc;
      text-decoration: none;
      transition: color 0.3s;
    }
    .cached-list a:hover {
      color: #006699;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">🔌</div>
    <h1>当前处于离线状态</h1>
    <p>您的设备没有连接到互联网，无法访问新内容。</p>
    <button class="retry-btn" onclick="window.location.reload()">重试连接网络</button>

    <!-- 显示已缓存的页面（供用户离线访问） -->
    <div class="cached-pages">
      <h3>您可以离线访问以下页面：</h3>
      <ul class="cached-list">
        <li><a href="/index.html">悠哉博客首页</a></li>
      </ul>
    </div>
  </div>

  <script>
    // 检查网络状态，若联网自动跳转首页
    setInterval(() => {
      if (navigator.onLine) {
        window.location.href = '/index.html';
      }
    }, 3000);

    // 加载已缓存的页面列表（从SW获取）
    if ('serviceWorker' in navigator && 'caches' in window) {
      caches.open('youzaiblog-cache-v1')
        .then(cache => {
          cache.keys()
            .then(requests => {
              const cachedList = document.querySelector('.cached-list');
              requests.forEach(request => {
                const url = request.url.replace(window.location.origin, '');
                if (url.endsWith('.html') && url !== '/offline.html' && !cachedList.querySelector(`a[href="${url}"]`)) {
                  const li = document.createElement('li');
                  li.innerHTML = `<a href="${url}">${url === '/' ? '首页' : url}</a>`;
                  cachedList.appendChild(li);
                }
              });
            });
        });
    }
  </script>
</body>
</html>
