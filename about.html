a.admin-btn{background-color:#e53935;} a.admin-btn:hover{background-color:#b71c1c;}
#install-btn,#sound-toggle-btn,#mode-toggle-btn,#back-top-btn{position:fixed;z-index:1000;padding:12px 18px;border-radius:6px;font-weight:bold;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;text-align:center;}
#install-btn{bottom:20px;left:20px;background:#4CAF50;color:white;width:120px;height:40px;font-size:14px;}

#sound-toggle-btn:hover{background:#b71c1c;transform:scale(1.05);}
#mode-toggle-btn{bottom:70px;right:20px;background:#555;color:white;font-size:14px;}
#mode-toggle-btn:hover{background:#333;transform:scale(1.05);}
#back-top-btn{bottom:120px;right:20px;background:#0088cc;color:white;font-size:14px;display:none;}

<div id="install-btn">安装至设备</div>

<button id="mode-toggle-btn">🌙 夜晚模式</button>
<button id="back-top-btn">⬆ 返回顶部</button>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  // Gitalk 初始化
  const gitalk = new Gitalk({
    clientID: 'Ov23lijfU0G3M7jiMFAW',
    clientSecret: '47120dd1810d3a2a9aa0033211f5ee73ef29baa3',
    repo: 'youzai',
    owner: 'fuchenyouzai',
    admin: ['fuchenyouzai'],
    id: location.pathname,
    distractionFreeMode: false,
    language: 'zh-CN'
  });
  gitalk.render('gitalk-container');

  // PWA 安装按钮
  const installBtn=document.getElementById('install-btn');
  let deferredPrompt;
  const isEdge=/Edg/i.test(navigator.userAgent);
  const isChrome=/Chrome/i.test(navigator.userAgent)&&!isEdge;
  if(isChrome){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});}
  installBtn.addEventListener('click',async()=>{
    if(isChrome){if(!deferredPrompt){alert("PWA 安装条件未满足，或已安装");return;}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}
    else if(isEdge){alert("请通过浏览器菜单（右上角 ⋮）选择“添加到桌面”来安装到手机或电脑桌面。");}
    else{alert("当前浏览器不支持自动安装，请使用 Chrome 或 Edge 浏览器。");}
  });

  // 声音按钮
  const soundBtn=document.getElementById('sound-toggle-btn');let soundOn=false;
  soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔇 关闭声音':'🔊 打开声音';});

  // 夜晚/白天模式
  const modeBtn=document.getElementById('mode-toggle-btn');
  modeBtn.addEventListener('click',()=>{document.body.classList.toggle('dark-mode');modeBtn.textContent=document.body.classList.contains('dark-mode')?"☀️ 白天模式":"🌙 夜晚模式";});

  // 返回顶部按钮
  const backTopBtn=document.getElementById('back-top-btn');
  window.addEventListener('scroll',()=>{backTopBtn.style.display=(window.scrollY>300)?'flex':'none';});
  backTopBtn.addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});
});
</script>
