<!-- Service Worker -->
<script>
  const CACHE_NAME = 'youzaiblog-cache-v1';
  const urlsToCache = [
    '/',
    '/index.html',
    '/icon-192.png',
    '/icon-512.png'
  ];

  // 安装 SW 并缓存关键资源
  self.addEventListener('install', event => {
    event.waitUntil(
      caches.open(CACHE_NAME)
        .then(cache => cache.addAll(urlsToCache))
        .then(() => self.skipWaiting())
    );
  });

  // 激活 SW
  self.addEventListener('activate', event => {
    event.waitUntil(
      caches.keys().then(keyList => {
        return Promise.all(keyList.map(key => {
          if (key !== CACHE_NAME) return caches.delete(key);
        }));
      }).then(() => self.clients.claim())
    );
  });

  // 拦截请求，先缓存后网络
  self.addEventListener('fetch', event => {
    event.respondWith(
      caches.match(event.request)
        .then(response => response || fetch(event.request))
    );
  });
</script>

<!-- YouTube Player API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  let livePlayer;
  let soundOn = false;

  function onYouTubeIframeAPIReady() {
    const latestLiveID = 'fN9uYWCjQaw';
    livePlayer = new YT.Player('live-player', {
      videoId: latestLiveID,
      playerVars: { autoplay: 1, mute: 1, controls: 1, modestbranding: 1 },
      events: { 'onReady': (event) => { event.target.mute(); } }
    });
  }

  // ===== 右下角声音开关按钮 =====
  const soundBtn = document.getElementById('sound-toggle-btn');
  soundBtn.addEventListener('click', () => {
    if (!livePlayer) return;
    if (soundOn) {
      livePlayer.mute();
      soundBtn.textContent = '🔊 打开声音';
      soundOn = false;
    } else {
      livePlayer.unMute();
      soundBtn.textContent = '🔇 关闭声音';
      soundOn = true;
    }
  });

  // ===== 白天/夜晚模式切换 =====
  const modeToggleBtn = document.getElementById('mode-toggle-btn');
  modeToggleBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      modeToggleBtn.textContent = '🌙 白天模式';
    } else {
      modeToggleBtn.textContent = '🌙 夜晚模式';
    }
  });

  // ===== 安装按钮功能 =====
  const installBtn = document.getElementById('install-btn');
  let deferredPrompt;
  
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((result) => {
        if (result.outcome === 'accepted') {
          console.log('用户接受了安装');
        } else {
          console.log('用户拒绝了安装');
        }
        deferredPrompt = null;
      });
    }
  });
</script>
