name: Build WebAPK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bubblewrap
          key: bubblewrap-deps-v2

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest 2>&1 | grep -v -E "deprecated|fund"

      - name: Auto-confirm JDK + SDK (match prompt timing)
        run: |
          {
            echo "Y"  # 应答JDK提问（工具启动即输出，不延迟）
            sleep 15  # 等JDK下载解压完成，直到SDK提问弹出
            echo "Y"  # 应答SDK提问
          } & bubblewrap init https://www.fuchenyouzai.dpdns.org --force

      - name: Build WebAPK
        run: bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
