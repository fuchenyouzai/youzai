name: Build WebAPK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache Bubblewrap deps
        uses: actions/cache@v3
        with:
          path: ~/.bubblewrap
          key: bubblewrap-deps

      - name: Install Bubblewrap (hide warnings)
        run: npm install -g @bubblewrap/cli@latest 2>&1 | grep -v -E "deprecated|fund"

      - name: Auto-confirm all 3 prompts (JDK+SDK+Terms)
        run: bash -c '{ echo "Y"; sleep 2; echo "Y"; sleep 2; echo "Y"; }' | bubblewrap init https://www.fuchenyouzai.dpdns.org --force

      - name: Build WebAPK
        run: bubblewrap build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
