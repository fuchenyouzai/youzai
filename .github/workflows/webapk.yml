name: Build WebAPK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 全局安装Bubblewrap最新版
        run: npm install -g @bubblewrap/cli@latest

      - name: 自动安装JDK+SDK并初始化配置
        run: printf "Y\nY\n" | bubblewrap init https://www.fuchenyouzai.dpdns.org --force

      - name: 构建WebAPK
        run: bubblewrap build

      - name: 上传APK作为制品
        uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
          retention-days: 7
