name: Build WebAPK

on:
  push:
    branches:
      - main  # 或者你选择的分支
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Set up JDK 17 (Adoptium)
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'  # 使用 temurin 发行版的 JDK

    - name: Install dependencies
      run: |
        npm install -g @bubblewrap/cli

    - name: Generate WebAPK using Bubblewrap
      run: |
        # 使用 --no-install-jdk 参数来跳过 JDK 安装
        bubblewrap init https://www.fuchenyouzai.dpdns.org --no-install-jdk  # 替换为你的博客 URL
        bubblewrap build

    - name: Upload WebAPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapk
        path: ./webapk/*.apk
