name: Build WebAPK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17 (Adoptium)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli@latest

    - name: Generate WebAPK
      run: |
        echo "n" | bubblewrap init https://www.fuchenyouzai.dpdns.org --force
        bubblewrap build --no-install-jdk

    - name: Upload WebAPK
      uses: actions/upload-artifact@v4
      with:
        name: webapk
        path: ./webapk/*.apk
        retention-days: 7
