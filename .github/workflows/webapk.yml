name: Build WebAPK

on:
  push:
    branches:
      - main  # 你也可以选择其他分支
  workflow_dispatch:  # 支持手动触发工作流

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies
      run: |
        npm install -g @bubblewrap/cli

    - name: Generate WebAPK using Bubblewrap
      run: |
        bubblewrap init https://www.fuchenyouzai.dpdns.org  # 替换为你的博客网址
        bubblewrap build

    - name: Upload WebAPK as artifact
      uses: actions/upload-artifact@v2
      with:
        name: webapk
        path: ./webapk/*.apk  # 生成的 APK 路径
