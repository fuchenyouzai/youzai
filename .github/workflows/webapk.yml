name: Build WebAPK

on:
  push:
    branches:
      - main  # 可替换为你的目标分支
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Set up JDK 17 (Adoptium)
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install -g @bubblewrap/cli

    - name: Generate WebAPK using Bubblewrap
      run: |
        # 完全英文命令+参数，无任何中文
        bubblewrap init https://www.fuchenyouzai.dpdns.org --no-install-jdk --force
        bubblewrap build

    - name: Upload WebAPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapk
        path: ./webapk/*.apk
