name: Build WebAPK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 恢复多路径缓存（用标准YAML分行格式，避免解析错误）
      - name: Cache JDK installer + SDK (fast speed)
        uses: actions/cache@v3
        with:
          path:
            - ~/.bubblewrap
            - ~/.android
          key: bubblewrap-deps-v8
          restore-keys: bubblewrap-deps-

      - name: Fix Bubblewrap dir permission (if exists)
        run: |
          if [ -d "/home/runner/.bubblewrap" ]; then
            sudo chown -R runner:runner ~/.bubblewrap
          else
            echo "Bubblewrap dir not found, skip permission fix"
          fi

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest 2>&1 | grep -v -E "deprecated|fund"

      - name: Install tools (expect + fix apt lock)
        run: |
          sudo rm -f /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock
          sudo apt-get update -y
          sudo apt-get install -y expect

      # 保留国内镜像+之前的快速配置
      - name: Smart auto-confirm (fast SDK download)
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 20
          polling_interval_seconds: 5
          warning_on_retry: true
          continue_on_error: false
          command: |
            export BUBBLEWRAP_JDK_MIRROR=https://mirrors.aliyun.com/openjdk/
            expect -c '
              spawn bubblewrap init https://www.fuchenyouzai.dpdns.org --force
              expect {
                "Do you want Bubblewrap to install the JDK" { send "Y\r"; exp_continue }
                "Do you want Bubblewrap to install the Android SDK" { send "Y\r"; exp_continue }
                "Do you agree to the Android SDK terms" { send "y\r"; sleep 5; exp_continue }
                "Timeout" { send "\r"; exp_continue }
                eof
              }
              wait
            '

      - name: Build WebAPK
        run: bubblewrap build

      - name: Upload APK (auto-clean after 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
          retention-days: 7
