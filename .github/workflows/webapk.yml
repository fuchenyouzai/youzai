name: Build WebAPK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache all deps (JDK+SDK+installers)
        uses: actions/cache@v3
        with:
          path:
            - ~/.bubblewrap
            - ~/.android
          key: bubblewrap-full-deps-v2

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest 2>&1 | grep -v -E "deprecated|fund"

      - name: Force confirm all prompts (no log interference)
        run: |
          {
            sleep 10
            echo "Y"
            sleep 20
            echo "Y"
            sleep 8
            echo "y"
          } & bubblewrap init https://www.fuchenyouzai.dpdns.org --force

      - name: Build WebAPK
        run: bubblewrap build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
