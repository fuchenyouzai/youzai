name: Build WebAPK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/cache@v3
        with:
          path: ~/.bubblewrap
          key: bubblewrap-deps
      - run: npm install -g @bubblewrap/cli@latest 2>&1 | grep -v -E "deprecated|fund"
      - run: { echo "Y"; sleep 2; echo "Y"; } | bubblewrap init https://www.fuchenyouzai.dpdns.org --force
      - run: bubblewrap build
      - uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
