name: Build WebAPK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 安装Bubblewrap（最新版）
      run: npm install -g @bubblewrap/cli@latest

    - name: 自动构建WebAPK（工具自动装JDK）
      run: |
        # 关键1：echo "Y" 同意工具自动安装JDK，不用你管
        # 关键2：全英文命令（init/--force），工具能识别
        echo "Y" | bubblewrap init https://www.fuchenyouzai.dpdns.org --force
        # 构建阶段无需额外参数，工具已自带JDK
        bubblewrap build

    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: webapk
        path: ./webapk/*.apk
        retention-days: 7
