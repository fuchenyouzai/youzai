name: Build WebAPK

on:
  push:
    branches:
      - main  # 可替换为你的目标分支
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'  # Bubblewrap 兼容的稳定版本

    - name: Set up JDK 17 (Adoptium)
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'  # 可靠的 JDK 发行版

    - name: Install dependencies
      run: |
        npm install -g @bubblewrap/cli  # 全局安装 WebAPK 打包工具

    - name: Generate WebAPK using Bubblewrap
      run: |
        # 关键修正：英文命令+空格分隔参数+--force避免交互
        bubblewrap init https://www.fuchenyouzai.dpdns.org --no-install-jdk --force
        # 执行打包（生成的 APK 会放在 ./webapk 目录）
        bubblewrap build

    - name: Upload WebAPK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapk  # 下载时的压缩包名称
        path: ./webapk/*.apk  # 指向 APK 文件的路径
