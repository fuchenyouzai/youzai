name: Build WebAPK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bubblewrap
          key: bubblewrap-deps-v2

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest 2>&1 | grep -v -E "deprecated|fund"

      - name: Auto-confirm all prompts
        run: |
          {
            sleep 10
            echo "Y"
            sleep 20
            echo "Y"
            sleep 8
            echo "y"
          } & bubblewrap init https://www.fuchenyouzai.dpdns.org --force

      - name: Build WebAPK
        run: bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webapk
          path: ./webapk/*.apk
