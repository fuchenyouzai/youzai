name: Build WebAPK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 强制跳过 JDK 安装确认，核心环境变量
      BUBBLEWRAP_SKIP_JDK_INSTALL: "true"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # 拉取仓库代码

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'  # 仅保留版本配置，删除 cache（因无依赖锁文件）

    - name: Set up JDK 17 (Adoptium)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Bubblewrap (最新版)
      run: npm install -g @bubblewrap/cli@latest  # 全局安装，无需项目锁文件

    - name: Generate WebAPK (无交互)
      run: |
        # 初始化网页配置（--force 跳过覆盖确认）
        bubblewrap init https://www.fuchenyouzai.dpdns.org --force
        # 构建 APK（--no-install-jdk 确认不安装 JDK）
        bubblewrap build --no-install-jdk

    - name: Upload WebAPK
      uses: actions/upload-artifact@v4
      with:
        name: webapk
        path: ./webapk/*.apk
        retention-days: 7  # 制品保留 7 天，可选
