name: Auto Build Web to APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 关键：提前安装expect，确保应答工具就绪
      - name: Install Tools (expect first)
        run: |
          sudo apt-get update && sudo apt-get install -y expect
          npm install -g @bubblewrap/cli@latest

      # 修复：用“持续监听”替代“顺序等待”，确保应答不遗漏
      - name: Auto Init & Build APK (stable response)
        run: |
          # 切换国内JDK镜像，加速下载（避免下载过慢导致应答超时）
          export BUBBLEWRAP_JDK_MIRROR=https://mirrors.aliyun.com/openjdk/
          expect -c '
            spawn bubblewrap init https://www.fuchenyouzai.dpdns.org --force
            # 持续监听所有可能的提问，出现即应答，不依赖顺序
            expect {
              "Do you want Bubblewrap to install the JDK" { 
                send "Y\r"; 
                exp_continue  # 应答后继续监听下一个提问
              }
              "Do you want Bubblewrap to install the Android SDK" { 
                send "Y\r"; 
                exp_continue 
              }
              "Do you agree to the Android SDK terms" { 
                send "y\r"; 
                sleep 5; 
                exp_continue 
              }
              eof  # 监听结束标志
            }
            wait  # 等待工具完成所有操作，不提前退出
          '
          bubblewrap build

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: YouzaiWeb-APK
          path: ./webapk/*.apk
          retention-days: 7
